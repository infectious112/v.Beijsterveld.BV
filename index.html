<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Van Beijsterveld B.V.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <title>Van Beijsterveld B.V.</title>
</head>
<body>
  <main id="app"></main>

  <dialog id="scannerDialog">
    <section class="sheet">
      <header class="sheet-header">
        <h2>Barcode scannen</h2>
        <button class="icon-button" data-close-scanner aria-label="Sluiten">×</button>
      </header>
      <div class="camera">
        <video id="scannerVideo" playsinline muted></video>
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>
      <p id="scannerStatus" class="status">Camera starten.</p>
      <button class="link-button" id="manualBarcode">Barcode handmatig invoeren</button>
    </section>
  </dialog>

  <dialog id="entryDialog">
    <form class="sheet" id="entryForm">
      <header class="sheet-header">
        <h2 id="entryTitle">Artikel toevoegen</h2>
        <button type="button" class="icon-button" data-close-entry aria-label="Sluiten">×</button>
      </header>
      <p class="notice" id="entryNotice"></p>
      <label>Barcode<input id="barcode" required inputmode="numeric"></label>
      <label>Artikelnaam<input id="productName" required placeholder="Tijdelijke artikelnaam"></label>
      <div class="grid-two">
        <label>Aantal<input id="quantity" required type="number" min="1" value="1"></label>
        <label>Eenheid
          <select id="unit">
            <option>stuk</option><option>doos</option><option>pak</option>
            <option>rol</option><option>zak</option><option>krat</option>
            <option>fles</option><option>bus</option><option>set</option>
          </select>
        </label>
      </div>
      <label>Opmerking<textarea id="note" placeholder="Bijvoorbeeld bijna leeg"></textarea></label>
      <button class="primary" type="submit">Toevoegen aan lijst</button>
    </form>
  </dialog>

  <dialog id="sessionDialog">
    <section class="sheet">
      <header class="sheet-header">
        <h2 id="sessionTitle">Scanronde</h2>
        <button class="icon-button" data-close-session aria-label="Sluiten">×</button>
      </header>
      <div id="sessionDetail"></div>
    </section>
  </dialog>

  <dialog id="updateDialog">
    <section class="sheet">
      <h2>Nieuwe versie beschikbaar</h2>
      <p>De update staat klaar. Jouw gegevens blijven behouden.</p>
      <div class="grid-two">
        <button class="secondary" id="updateLater">Later</button>
        <button class="primary" id="updateNow">Nu bijwerken</button>
      </div>
    </section>
  </dialog>


  <dialog id="importDialog">
    <section class="sheet">
      <header class="sheet-header">
        <h2>Artikelimport controleren</h2>
        <button class="icon-button" data-close-import aria-label="Sluiten">×</button>
      </header>
      <div id="importSummary"></div>
      <button class="primary" id="confirmImport">Importeren</button>
    </section>
  </dialog>

  <dialog id="articleDialog">
    <section class="sheet article-sheet">
      <header class="sheet-header">
        <h2>Bekende artikelen</h2>
        <button class="icon-button" data-close-articles aria-label="Sluiten">×</button>
      </header>
      <input id="articleSearch" type="search" placeholder="Zoek op naam, nummer, merk of barcode">
      <div class="article-filters">
        <select id="articleCategoryFilter"><option value="">Alle categorieën</option></select>
        <select id="articleSupplierFilter"><option value="">Alle leveranciers</option></select>
        <select id="articleStatusFilter">
          <option value="all">Actief en inactief</option>
          <option value="active">Alleen actief</option>
          <option value="inactive">Alleen inactief</option>
        </select>
        <label class="favorite-filter"><input id="articleFavoriteFilter" type="checkbox"> Alleen favorieten</label>
      </div>
      <button class="primary" id="newArticle" type="button">Nieuw artikel toevoegen</button>
      <div id="articleList"></div>
      <section id="articleEdit" class="article-edit" hidden>
        <div class="about-divider"></div>
        <h3 id="articleEditTitle">Artikel bewerken</h3>
        <form id="articleEditForm">
          <label>Barcode<input id="articleBarcode" required></label>
          <label>Artikelnummer<input id="articleNumber"></label>
          <label>Artikelnaam<input id="articleName" required></label>
          <div class="grid-two">
            <label>Eenheid<select id="articleUnit"></select></label>
            <label>Categorie<input id="articleCategory" list="categorySuggestions"></label>
          </div>
          <div class="grid-two">
            <label>Leverancier<input id="articleSupplier" list="supplierSuggestions"></label>
            <label>Merk<input id="articleBrand"></label>
          </div>
          <label>Opslaglocatie<input id="articleLocation" placeholder="Bijvoorbeeld A01-B02-C03"></label>
          <label>Opmerking<textarea id="articleRemarks"></textarea></label>
          <div class="article-checks">
            <label><input id="articleActive" type="checkbox" checked> Actief artikel</label>
            <label><input id="articleFavorite" type="checkbox"> Favoriet</label>
          </div>
          <datalist id="categorySuggestions"></datalist>
          <datalist id="supplierSuggestions"></datalist>
          <div class="button-grid">
            <button class="secondary" id="cancelArticleEdit" type="button">Annuleren</button>
            <button class="primary" type="submit">Opslaan</button>
          </div>
        </form>
      </section>
    </section>
  </dialog>

  <input id="importFile" type="file" accept=".csv,.json,text/csv,application/json" hidden>
  <input id="restoreFile" type="file" accept=".json,application/json" hidden>

  <div class="toast" id="toast"></div>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/scanner.js"></script>
  <script src="./js/updates.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
